name: Build Checkino Bazaar and Myket APKs (WF3)

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: Optional exact path to the Checkino source ZIP in repository root
        required: false
        type: string
      api_url_override:
        description: Optional HTTPS api.php URL for a one-off build
        required: false
        type: string
      bazaar_product_id:
        description: Bazaar product ID / SKU
        required: false
        default: checkino_pro_monthly
        type: string
      myket_product_id:
        description: Myket product ID / SKU
        required: false
        default: checkino_pro_monthly
        type: string
  push:
    branches: [main, master]
    paths:
      - 'checkino_flutter_*.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read
  actions: write

jobs:
  build-store-apks:
    name: Signed Bazaar and Myket APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare diagnostics directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/checkino_failure_logs"
          printf 'run_id=%s\nrun_number=%s\nsha=%s\nref=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$GITHUB_REF" \
            > "$GITHUB_WORKSPACE/checkino_failure_logs/run-info.txt"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter 3.44.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Record tool versions
        shell: bash
        run: |
          set -euo pipefail
          {
            java -version
            flutter --version
            flutter doctor -v
          } 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/tool-versions.txt"

      - name: Locate latest source ZIP
        id: source
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/source-selection.txt"
          import os
          import pathlib
          import re

          requested = os.environ.get('REQUESTED_ZIP', '').strip()
          root = pathlib.Path('.').resolve()

          if requested:
              selected = (root / requested).resolve()
              try:
                  selected.relative_to(root)
              except ValueError as exc:
                  raise SystemExit('ERROR: source_zip must stay inside the repository.') from exc
              if not selected.is_file() or selected.suffix.lower() != '.zip':
                  raise SystemExit(f'ERROR: Requested source ZIP does not exist: {requested}')
          else:
              candidates = [path for path in root.glob('checkino_flutter_*.zip') if path.is_file()]
              if not candidates:
                  raise SystemExit('ERROR: Upload one checkino_flutter_*.zip source file to repository root.')

              import subprocess

              def version_key(path: pathlib.Path):
                  match = re.search(r'v(\d+)[._-](\d+)[._-](\d+)(?:[._-](?:build)?(\d+))?', path.name.lower())
                  return tuple(int(value) for value in match.groups(default='0')) if match else (0, 0, 0, 0)

              def last_commit_time(path: pathlib.Path) -> int:
                  try:
                      value = subprocess.check_output(
                          ['git', 'log', '-1', '--format=%ct', '--', str(path.relative_to(root))],
                          text=True,
                      ).strip()
                      return int(value or 0)
                  except (subprocess.SubprocessError, ValueError):
                      return 0

              selected = max(
                  candidates,
                  key=lambda path: (
                      version_key(path),
                      last_commit_time(path),
                      path.stat().st_mtime_ns,
                      path.name,
                  ),
              )

          relative = selected.relative_to(root)
          print(f'Selected source ZIP: {relative}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'zip_path={relative}\n')
          PY

      - name: Extract and locate Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted_source
          mkdir -p extracted_source
          unzip -q "${{ steps.source.outputs.zip_path }}" -d extracted_source

          python3 - <<'PY' 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/project-location.txt"
          import os
          import pathlib

          root = pathlib.Path('extracted_source').resolve()
          candidates = [
              pubspec.parent
              for pubspec in root.rglob('pubspec.yaml')
              if (pubspec.parent / 'lib' / 'main.dart').is_file()
              and (pubspec.parent / 'android').is_dir()
              and not any(part in {'.dart_tool', 'build', '.git'} for part in pubspec.parent.parts)
          ]

          if len(candidates) != 1:
              raise SystemExit(f'ERROR: Expected exactly one Flutter Android project, found {len(candidates)}.')

          selected = candidates[0]
          print(f'Flutter project: {selected}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'dir={selected}\n')
          PY

      - name: Validate dual-store source and signing
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"

          EXPECTED_PACKAGE='mk.kadkhodai.chekino'
          EXPECTED_API='https://podtman.anony.ir/chekino/api.php'

          {
            grep -F "namespace = \"$EXPECTED_PACKAGE\"" android/app/build.gradle
            grep -F "applicationId = \"$EXPECTED_PACKAGE\"" android/app/build.gradle
            grep -F 'flavorDimensions "store"' android/app/build.gradle
            grep -F 'bazaar {' android/app/build.gradle
            grep -F 'myket {' android/app/build.gradle
            grep -F 'flutter_poolakey: ^2.2.0+1.0.0' pubspec.yaml
            grep -F 'myket_iap: ^1.1.12' pubspec.yaml
            grep -F 'prepare_store_build.py' tool/prepare_store_build.py
            grep -F 'flutter_poolakey' tool/prepare_store_build.py
            grep -F 'myket_iap' tool/prepare_store_build.py
            test -s tool/store_stubs/bazaar_billing_service.stub
            test -s tool/store_stubs/myket_billing_service.stub
            grep -F 'CHECKINO_BAZAAR_PRODUCT_ID' lib/config/store_environment.dart
            grep -F 'CHECKINO_BAZAAR_RSA_KEY' lib/config/store_environment.dart
            grep -F 'CHECKINO_MYKET_PRODUCT_ID' lib/config/store_environment.dart
            grep -F 'CHECKINO_MYKET_RSA_KEY' lib/config/store_environment.dart
            grep -F 'myket_subscription_verify' lib/services/remote_support_controller.dart
            grep -F 'bazaar_subscription_verify' lib/services/remote_support_controller.dart
            grep -F "package $EXPECTED_PACKAGE" "android/app/src/main/kotlin/mk/kadkhodai/chekino/MainActivity.kt"
            grep -F "$EXPECTED_API" lib/config/app_environment.dart
          } 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/source-validation.txt"

          test -s android/bazikhone_release_key.jks
          test -s android/key.properties
          grep -Eq '^keyAlias=bazikhone[[:space:]]*$' android/key.properties
          grep -Eq '^storeFile=\.\./bazikhone_release_key\.jks[[:space:]]*$' android/key.properties

          chmod +x android/gradlew
          android/gradlew --version 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/gradle-version.txt"
          grep -Fq 'Gradle 8.14.5' "$GITHUB_WORKSPACE/checkino_failure_logs/gradle-version.txt"

          if grep -R --include='*.dart' -nE '(^|[^A-Za-z0-9_])IconData[[:space:]]*\(' lib \
              | tee "$GITHUB_WORKSPACE/checkino_failure_logs/dynamic-icondata.txt" \
              | grep -q .; then
            echo 'ERROR: Dynamic IconData construction breaks Android release icon tree-shaking.'
            exit 1
          fi

      - name: Resolve independent store values
        shell: bash
        env:
          BAZAAR_PRODUCT_ID_INPUT: ${{ inputs.bazaar_product_id }}
          MYKET_PRODUCT_ID_INPUT: ${{ inputs.myket_product_id }}
          BAZAAR_RSA_KEY_SECRET: ${{ secrets.CHECKINO_BAZAAR_RSA_KEY }}
          MYKET_RSA_KEY_SECRET: ${{ secrets.CHECKINO_MYKET_RSA_KEY }}
        run: |
          set -euo pipefail

          BAZAAR_PRODUCT_ID="${BAZAAR_PRODUCT_ID_INPUT:-checkino_pro_monthly}"
          MYKET_PRODUCT_ID="${MYKET_PRODUCT_ID_INPUT:-checkino_pro_monthly}"
          BAZAAR_RSA_KEY="$(printf '%s' "${BAZAAR_RSA_KEY_SECRET:-}" | tr -d '\r\n')"
          MYKET_RSA_KEY="$(printf '%s' "${MYKET_RSA_KEY_SECRET:-}" | tr -d '\r\n')"

          test -n "$BAZAAR_PRODUCT_ID" || { echo 'ERROR: Bazaar product ID is empty.'; exit 1; }
          test -n "$MYKET_PRODUCT_ID" || { echo 'ERROR: Myket product ID is empty.'; exit 1; }

          {
            echo "CHECKINO_BAZAAR_PRODUCT_ID=$BAZAAR_PRODUCT_ID"
            echo "CHECKINO_MYKET_PRODUCT_ID=$MYKET_PRODUCT_ID"
            echo "CHECKINO_BAZAAR_RSA_KEY=$BAZAAR_RSA_KEY"
            echo "CHECKINO_MYKET_RSA_KEY=$MYKET_RSA_KEY"
          } >> "$GITHUB_ENV"

          {
            echo '### Checkino store build configuration'
            echo "- Bazaar SKU: \`$BAZAAR_PRODUCT_ID\`"
            echo "- Myket SKU: \`$MYKET_PRODUCT_ID\`"
            if [ -n "$MYKET_RSA_KEY" ]; then
              echo '- Myket RSA: configured; final billing-enabled APK will be built.'
            else
              echo '- Myket RSA: not configured; bootstrap APK will still be built for initial Myket panel registration. Billing remains disabled until CHECKINO_MYKET_RSA_KEY is added and the workflow is rerun.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies and run checks
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          flutter pub get 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/flutter-pub-get.txt"
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/flutter-analyze.txt"
          flutter test 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/flutter-test.txt"

      - name: Read release version
        shell: bash
        run: |
          set -euo pipefail
          cd "${{ steps.project.outputs.dir }}"
          python3 - <<'PY' | tee "$GITHUB_WORKSPACE/checkino_failure_logs/version.txt" >> "$GITHUB_ENV"
          import pathlib
          import re

          text = pathlib.Path('pubspec.yaml').read_text(encoding='utf-8')
          match = re.search(r'^version:\s*([^+\s]+)\+(\d+)\s*$', text, re.M)
          if not match:
              raise SystemExit('ERROR: pubspec.yaml must contain version x.y.z+build.')
          print(f'CHECKINO_VERSION_NAME={match.group(1)}')
          print(f'CHECKINO_VERSION_CODE={match.group(2)}')
          PY

      - name: Prepare isolated Bazaar and Myket workspaces
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="${{ steps.project.outputs.dir }}"
          WORKSPACE_ROOT="$GITHUB_WORKSPACE/store_workspaces"

          rm -rf "$WORKSPACE_ROOT"
          mkdir -p "$WORKSPACE_ROOT"

          python3 "$SOURCE_DIR/tool/prepare_store_build.py" \
            --source "$SOURCE_DIR" \
            --output "$WORKSPACE_ROOT/bazaar" \
            --store bazaar \
            2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/prepare-bazaar-workspace.txt"

          python3 "$SOURCE_DIR/tool/prepare_store_build.py" \
            --source "$SOURCE_DIR" \
            --output "$WORKSPACE_ROOT/myket" \
            --store myket \
            2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/prepare-myket-workspace.txt"

          {
            echo '--- Bazaar workspace ---'
            cat "$WORKSPACE_ROOT/bazaar/STORE_BUILD_PREPARATION.txt"
            grep -F 'flutter_poolakey:' "$WORKSPACE_ROOT/bazaar/pubspec.yaml"
            ! grep -Fq 'myket_iap:' "$WORKSPACE_ROOT/bazaar/pubspec.yaml"
            grep -Fq 'Compile-time stub used only in Bazaar builds' \
              "$WORKSPACE_ROOT/bazaar/lib/services/myket_billing_service.dart"

            echo '--- Myket workspace ---'
            cat "$WORKSPACE_ROOT/myket/STORE_BUILD_PREPARATION.txt"
            grep -F 'myket_iap:' "$WORKSPACE_ROOT/myket/pubspec.yaml"
            ! grep -Fq 'flutter_poolakey:' "$WORKSPACE_ROOT/myket/pubspec.yaml"
            grep -Fq 'Compile-time stub used only in Myket builds' \
              "$WORKSPACE_ROOT/myket/lib/services/bazaar_billing_service.dart"
          } 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/store-workspace-validation.txt"

      - name: Build signed Bazaar APK in isolated workspace
        shell: bash
        env:
          API_URL_OVERRIDE: ${{ inputs.api_url_override }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/store_workspaces/bazaar"

          COMMON_ARGS=()
          if [ -n "${API_URL_OVERRIDE:-}" ]; then
            case "$API_URL_OVERRIDE" in
              https://*/api.php|https://*api.php) ;;
              *) echo 'ERROR: api_url_override must be an HTTPS URL ending in api.php.'; exit 1 ;;
            esac
            COMMON_ARGS+=("--dart-define=CHECKINO_API_URL=$API_URL_OVERRIDE")
          fi

          BAZAAR_ARGS=(
            "--dart-define=CHECKINO_STORE=bazaar"
            "--dart-define=CHECKINO_BAZAAR_PRODUCT_ID=$CHECKINO_BAZAAR_PRODUCT_ID"
          )
          if [ -n "${CHECKINO_BAZAAR_RSA_KEY:-}" ]; then
            BAZAAR_ARGS+=("--dart-define=CHECKINO_BAZAAR_RSA_KEY=$CHECKINO_BAZAAR_RSA_KEY")
          fi

          flutter pub get \
            2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/flutter-pub-get-bazaar.txt"

          flutter build apk --release --flavor bazaar \
            "${COMMON_ARGS[@]}" \
            "${BAZAAR_ARGS[@]}" \
            --build-name "$CHECKINO_VERSION_NAME" \
            --build-number "$CHECKINO_VERSION_CODE" \
            2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/build-bazaar.txt"

          OUTPUT_DIR="$GITHUB_WORKSPACE/android_release"
          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"
          cp build/app/outputs/flutter-apk/app-bazaar-release.apk \
            "$OUTPUT_DIR/checkino-bazaar-${CHECKINO_VERSION_NAME}+${CHECKINO_VERSION_CODE}.apk"

      - name: Build signed Myket APK in isolated workspace
        shell: bash
        env:
          API_URL_OVERRIDE: ${{ inputs.api_url_override }}
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/store_workspaces/myket"

          COMMON_ARGS=()
          if [ -n "${API_URL_OVERRIDE:-}" ]; then
            case "$API_URL_OVERRIDE" in
              https://*/api.php|https://*api.php) ;;
              *) echo 'ERROR: api_url_override must be an HTTPS URL ending in api.php.'; exit 1 ;;
            esac
            COMMON_ARGS+=("--dart-define=CHECKINO_API_URL=$API_URL_OVERRIDE")
          fi

          MYKET_ARGS=(
            "--dart-define=CHECKINO_STORE=myket"
            "--dart-define=CHECKINO_MYKET_PRODUCT_ID=$CHECKINO_MYKET_PRODUCT_ID"
          )
          if [ -n "${CHECKINO_MYKET_RSA_KEY:-}" ]; then
            MYKET_ARGS+=("--dart-define=CHECKINO_MYKET_RSA_KEY=$CHECKINO_MYKET_RSA_KEY")
          fi

          flutter pub get \
            2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/flutter-pub-get-myket.txt"

          flutter build apk --release --flavor myket \
            "${COMMON_ARGS[@]}" \
            "${MYKET_ARGS[@]}" \
            --build-name "$CHECKINO_VERSION_NAME" \
            --build-number "$CHECKINO_VERSION_CODE" \
            2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/build-myket.txt"

          OUTPUT_DIR="$GITHUB_WORKSPACE/android_release"
          mkdir -p "$OUTPUT_DIR"
          cp build/app/outputs/flutter-apk/app-myket-release.apk \
            "$OUTPUT_DIR/checkino-myket-${CHECKINO_VERSION_NAME}+${CHECKINO_VERSION_CODE}.apk"

      - name: Verify APK count, package, version and signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"

          test "$(find android_release -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 2
          ! find android_release -maxdepth 1 -type f ! -name '*.apk' | grep -q .

          for apk in android_release/*.apk; do
            echo "Verifying $apk"
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            BADGING="$($AAPT dump badging "$apk" | head -n 1)"
            echo "$BADGING"
            grep -Fq "name='mk.kadkhodai.chekino'" <<< "$BADGING"
            grep -Fq "versionCode='$CHECKINO_VERSION_CODE'" <<< "$BADGING"
            grep -Fq "versionName='$CHECKINO_VERSION_NAME'" <<< "$BADGING"
          done 2>&1 | tee "$GITHUB_WORKSPACE/checkino_failure_logs/apk-verification.txt"

      - name: Remove older Checkino build artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const prefixes = ['checkino-store-apks-', 'checkino-failure-logs-'];
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            for (const artifact of artifacts) {
              if (prefixes.some((prefix) => artifact.name.startsWith(prefix))) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                core.info(`Deleted old artifact: ${artifact.name}`);
              }
            }

      - name: Upload APK-only release artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkino-store-apks-${{ env.CHECKINO_VERSION_NAME }}-${{ env.CHECKINO_VERSION_CODE }}
          path: android_release/*.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Collect failure context
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          {
            echo '--- repository files ---'
            find . -maxdepth 3 -type f | sort
            echo '--- extracted APK outputs ---'
            find . -path '*/build/app/outputs/*' -type f | sort
          } > "$GITHUB_WORKSPACE/checkino_failure_logs/file-list.txt" 2>&1

      - name: Upload failure logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: checkino-failure-logs-${{ github.run_number }}
          path: checkino_failure_logs/
          if-no-files-found: warn
          retention-days: 14
